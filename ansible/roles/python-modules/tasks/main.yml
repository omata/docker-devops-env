---

- name: "Install required python packages from Ubuntu repositories"
  ansible.builtin.apt:
    name:
      - "python3-boto3"
      - "python3-botocore"
      - "python3-httpx"
      - "python3-jinja2"
      - "python3-pip"
      - "python3-pydantic"
      - "python3-pygit2"
      - "python3-pylint-common"
      - "python3-redis"
      - "python3-rich"
      - "python3-validators"
      - "python3-yaml"
      - "python3-yapf"
    state: "present"

- name: "Upgrade boto3, botocore and requests into devops user site-packages"
  ansible.builtin.pip:
    name:
      - "boto3"
      - "botocore"
      - "requests"
    state: "latest"
    extra_args: "--user"
  become_user: "devops"
