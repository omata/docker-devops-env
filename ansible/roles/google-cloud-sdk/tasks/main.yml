---

- name: "Create temporary directory"
  ansible.builtin.tempfile:
    state: directory
    prefix: "gcp-"
  register: temp_dir

- block:
    - name: "Download Google Cloud SDK repository key"
      ansible.builtin.get_url:
        url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
        dest: "{{ temp_dir.path }}/google-cloud-sdk.asc"
        mode: "0644"
        force: true

    - name: "Convert key to binary GPG format"
      ansible.builtin.command:
        cmd: "gpg --dearmor -o /etc/apt/trusted.gpg.d/google-cloud-sdk.gpg {{ temp_dir.path }}/google-cloud-sdk.asc"
        creates: "/etc/apt/trusted.gpg.d/google-cloud-sdk.gpg"

    - name: "Set permissions on keyring file"
      ansible.builtin.file:
        path: "/etc/apt/trusted.gpg.d/google-cloud-sdk.gpg"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "Configure Google Cloud SDK repository"
      ansible.builtin.apt_repository:
        repo: "{{ gcp_cli_ppa_url }}"
        state: "present"

    - name: "Install Google Cloud SDK"
      ansible.builtin.apt:
        name:
          - "google-cloud-sdk"
        state: "present"
        update_cache: true

  always:
    - name: "Clean up temporary directory"
      ansible.builtin.file:
        path: "{{ temp_dir.path }}"
        state: "absent"
      when: temp_dir.path is defined
