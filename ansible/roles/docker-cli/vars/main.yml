# vars file for docker-cli
base_arch:
  x86_64: 'amd64'
  amd64: 'amd64'
  aarch64: 'arm64'

# vars for docker-cli
docker_cli_ppa_url: "deb [arch={{ base_arch[ansible_architecture] }} signed-by=/etc/apt/trusted.gpg.d/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
